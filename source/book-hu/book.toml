[book]
title = "A Specifikációszerkesztő könyve"
description = "Teljes útmutató az ELTE Specifikációszerkesztőhöz és a speci-localhoz"
authors = ["csabi.zip"]
language = "hu"

[build]
build-dir = "../../hu"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
git-repository-url = "https://github.com/FCsab/specifikacio-dokumentacio"
git-repository-icon = "fab-github"
additional-css = ["theme/custom.css"]
additional-js = ["theme/speci-hl.js", "theme/site.js"]
hash-files = false
site-url = "/hu/"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
