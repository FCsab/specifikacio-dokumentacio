<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" font-family="system-ui, sans-serif" font-size="14">
  <title>Layout of the Specification Editor, parts numbered 1 to 18</title>
  <style>
    .pane { fill: #fbfaf5; stroke: #8a93a3; }
    .bar { fill: #3f4d63; }
    .btn { fill: #1f2937; }
    .tog { fill: #10a35a; }
    .lab { fill: #fff; font-weight: 600; text-anchor: middle; }
    .txt { fill: #111827; font-weight: 600; }
    .dim { fill: #6b7280; }
    .num { fill: #fff; stroke: #a11212; stroke-width: 2.5; }
    .numt { fill: #a11212; font-weight: 700; text-anchor: middle; }
  </style>
  <rect width="960" height="520" fill="#fff"/>
  <!-- title bar -->
  <rect class="bar" x="10" y="50" width="940" height="44"/>
  <text x="24" y="78" fill="#fff" font-size="18">Specification editor</text>
  <rect x="222" y="60" width="210" height="24" rx="4" fill="#eef1f5"/>
  <text x="232" y="77" class="dim">Task name…</text>
  <rect class="btn" x="496" y="60" width="78" height="24" rx="4"/>
  <text class="lab" x="535" y="77">A–A</text>
  <rect class="tog" x="582" y="60" width="24" height="24" rx="4"/><text class="lab" x="594" y="77">S</text>
  <rect class="tog" x="608" y="60" width="24" height="24" rx="4"/><text class="lab" x="620" y="77">D</text>
  <rect class="tog" x="634" y="60" width="24" height="24" rx="4"/><text class="lab" x="646" y="77">V</text>
  <rect class="btn" x="660" y="60" width="24" height="24" rx="4"/><text class="lab" x="672" y="77">H</text>
  <rect class="btn" x="688" y="60" width="44" height="24" rx="4"/><text class="lab" x="710" y="77">New</text>
  <rect class="btn" x="736" y="60" width="46" height="24" rx="4"/><text class="lab" x="759" y="77">Save</text>
  <rect class="btn" x="786" y="60" width="104" height="24" rx="4"/><text class="lab" x="838" y="77">Documentation</text>
  <rect class="btn" x="894" y="60" width="52" height="24" rx="4"/><text class="lab" x="920" y="77">Usage</text>
  <!-- panes -->
  <rect class="pane" x="10" y="94" width="580" height="200"/>
  <rect class="pane" x="10" y="294" width="580" height="186"/>
  <rect class="pane" x="590" y="94" width="360" height="386"/>
  <text class="txt" x="50" y="122">Specification</text>
  <text x="290" y="122" class="dim">Insert:</text>
  <rect x="340" y="106" width="210" height="24" rx="4" fill="#eef1f5" stroke="#8a93a3"/>
  <text x="352" y="123" class="txt">∈   ∀   ∃   ≠   ≤   ≥</text>
  <text class="txt" x="50" y="322">Visualization</text>
  <text x="200" y="322" class="dim">← → stepping</text>
  <text x="330" y="322" class="dim">☑ Post.cond.</text>
  <rect x="450" y="306" width="120" height="24" rx="4" fill="#eef1f5" stroke="#8a93a3"/>
  <text x="458" y="323" class="dim">Stepper | Step list</text>
  <text class="txt" x="630" y="122">Data</text>
  <rect x="820" y="106" width="110" height="24" rx="12" fill="#fff" stroke="#8a93a3"/>
  <text x="875" y="123" class="txt" text-anchor="middle">Evaluate</text>
  <rect x="604" y="140" width="28" height="26" fill="#8a93a3"/><text class="lab" x="618" y="158">+</text>
  <rect x="634" y="140" width="28" height="26" fill="#8a93a3"/><text class="lab" x="648" y="158">-</text>
  <rect x="666" y="140" width="28" height="26" fill="#3f4d63"/><text class="lab" x="680" y="158">1</text>
  <!-- footer -->
  <rect class="bar" x="10" y="480" width="940" height="22"/>
  <text x="20" y="496" fill="#fff" font-size="12">Your name (login) · Logout</text>
  <text x="620" y="496" fill="#fff" font-size="12">Author and version</text>
  <!-- number badges -->
  <g>
    <circle class="num" cx="28" cy="117" r="13"/><text class="numt" x="28" y="122">1</text>
    <circle class="num" cx="608" cy="117" r="13"/><text class="numt" x="608" y="122">2</text>
    <circle class="num" cx="28" cy="317" r="13"/><text class="numt" x="28" y="322">3</text>
    <circle class="num" cx="535" cy="30" r="13"/><text class="numt" x="535" y="35">4</text>
    <circle class="num" cx="594" cy="30" r="13"/><text class="numt" x="594" y="35">5</text>
    <circle class="num" cx="622" cy="30" r="13"/><text class="numt" x="622" y="35">6</text>
    <circle class="num" cx="650" cy="30" r="13"/><text class="numt" x="650" y="35">7</text>
    <circle class="num" cx="678" cy="30" r="13"/><text class="numt" x="678" y="35">8</text>
    <circle class="num" cx="710" cy="30" r="13"/><text class="numt" x="710" y="35">9</text>
    <circle class="num" cx="759" cy="30" r="13"/><text class="numt" x="759" y="35">10</text>
    <circle class="num" cx="838" cy="30" r="13"/><text class="numt" x="838" y="35">11</text>
    <circle class="num" cx="920" cy="30" r="13"/><text class="numt" x="920" y="35">12</text>
    <circle class="num" cx="572" cy="118" r="13"/><text class="numt" x="572" y="123">13</text>
    <circle class="num" cx="800" cy="118" r="13"/><text class="numt" x="800" y="123">14</text>
    <circle class="num" cx="716" cy="153" r="13"/><text class="numt" x="716" y="158">15</text>
    <circle class="num" cx="60" cy="509" r="10"/><text class="numt" x="60" y="514" font-size="12">16</text>
    <circle class="num" cx="600" cy="509" r="10"/><text class="numt" x="600" y="514" font-size="12">17</text>
    <circle class="num" cx="327" cy="30" r="13"/><text class="numt" x="327" y="35">18</text>
  </g>
</svg>
